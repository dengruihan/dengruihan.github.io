<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raymond Deng Portfolio</title>
    <script>
      (function(w,d){
        w.ra_track = function(eventType, eventName, properties) {
          properties = properties || {};
          properties.event_type = eventType;
          properties.event_name = eventName;
          properties.url = w.location.href;
          properties.referrer = d.referrer;
          properties.timestamp = Date.now();
          
          var params = Object.keys(properties).map(function(key) {
            return encodeURIComponent(key) + '=' + encodeURIComponent(properties[key]);
          }).join('&');
          
          var img = new Image();
          img.src = `http://110.40.153.38:5500/api/pixel?${params}`;
          console.log('[RA] 追踪事件:', eventType, eventName);
        };
        
        w.ra_track('pageview', w.location.pathname, {});
        
        w.addEventListener('beforeunload', function() {
          w.ra_track('pageview', 'leave', {});
        });
      })(window,document);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
